<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 찾기</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Apple SD Gothic Neo", sans-serif;
        }

        body {
            background-color: #ffffff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 400px;
            width: 100%;
        }

        .back-button {
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .highlight {
            color: #9b59b6;
            font-weight: bold;
            text-decoration: none;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
        }

        .input-group input {
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            transition: border-color 0.3s ease;
        }

        .input-group input:focus {
            border-color: #9b59b6;
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 12px;
            transition: background-color 0.3s ease;
        }

        .btn-primary {
            background-color: #9b59b6;
            color: white;
        }

        .btn-primary:hover {
            background-color: #8e44ad;
        }

        .btn-secondary {
            background-color: #bdc3c7;
            color: white;
        }

        .btn-secondary:hover {
            background-color: #95a5a6;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="back-button" onclick="history.back()">
        <span>⬅</span> 뒤로 가기
    </div>

    <a href="#" class="highlight">비밀번호 찾기</a>
    <h2>가입 시 등록했던 이메일 주소를 입력해주세요.</h2>
    <p>이메일 주소로 인증번호를 보내드립니다.</p>

    <div class="input-group">
        <label for="email">이메일</label>
        <input type="email" id="email" placeholder="이메일 입력" required>
        <button class="btn btn-primary" onclick="sendEmail()">인증번호 전송</button>
    </div>

    <div class="input-group">
        <label for="code">인증번호</label>
        <input type="text" id="code" placeholder="인증번호 입력" required>
        <button class="btn btn-secondary" onclick="findPassword()">비밀번호 확인</button>
    </div>
</div>

<script>
    // ✅ 이메일로 인증번호 전송
    function sendEmail() {
        const email = document.getElementById('email').value.trim();

        console.log("📨 [DEBUG] sendEmail() 호출됨 - 입력된 이메일:", email);

        if (!email) {
            console.warn("🚨 [WARN] 이메일이 입력되지 않음!");
            alert("이메일을 입력해주세요.");
            return;
        }

        fetch('/member/send-email', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `email=${encodeURIComponent(email)}`
        })
            .then(response => {
                console.log("🔄 [DEBUG] 서버 응답 상태 코드:", response.status);
                return response.ok ? response.text() : Promise.reject('🚫 이메일 전송 실패');
            })
            .then(responseText => {
                console.log("✅ [DEBUG] 이메일 전송 성공 - 응답 메시지:", responseText);
                alert(responseText);
            })
            .catch(error => {
                console.error("❌ [ERROR] 이메일 전송 실패:", error);
                alert(error);
            });
    }

    // ✅ 비밀번호 찾기 (인증번호 검증)
    function findPassword() {
        const email = document.getElementById('email').value.trim();
        const code = document.getElementById('code').value.trim();

        console.log("🔍 [DEBUG] findPassword() 호출됨 - 이메일:", email, "인증번호:", code);

        if (!email) {
            console.warn("🚨 [WARN] 이메일이 입력되지 않음!");
            alert("이메일을 입력해주세요.");
            return;
        }

        if (!code) {
            console.warn("🚨 [WARN] 인증번호가 입력되지 않음!");
            alert("인증번호를 입력해주세요.");
            return;
        }

        fetch('/member/find-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `email=${encodeURIComponent(email)}&code=${encodeURIComponent(code)}`
        })
            .then(response => {
                console.log("🔄 [DEBUG] 서버 응답 상태 코드:", response.status);

                if (response.ok) {
                    return response.text();
                } else if (response.status === 401) {
                    console.warn("🚨 [WARN] 401 Unauthorized - 인증번호가 올바르지 않음.");
                    throw new Error('🚫 인증번호가 올바르지 않습니다.');
                } else if (response.status === 400) {
                    console.warn("🚨 [WARN] 400 Bad Request - 잘못된 요청");
                    throw new Error('🚫 잘못된 요청입니다.');
                } else if (response.status === 500) {
                    console.error("❌ [ERROR] 500 서버 내부 오류 발생");
                    throw new Error('🚫 서버 오류가 발생했습니다.');
                } else {
                    throw new Error('🚫 알 수 없는 오류 발생');
                }
            })
            .then(password => {
                console.log("✅ [DEBUG] 비밀번호 찾기 성공 - 응답 메시지:", password);
                alert(`✅ 비밀번호: ${password}`);
            })
            .catch(error => {
                console.error("❌ [ERROR] 비밀번호 찾기 실패:", error);
                alert(error.message);
            });
    }
</script>

</body>
</html>
