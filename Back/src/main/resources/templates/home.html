<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메인 홈</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Arial', sans-serif;
        }
        .container {
            max-width: 400px;
            margin: 20px auto;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .stats-container {
            text-align: center;
            background-color: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
        }
        .stats-container h3 {
            font-size: 16px;
            margin-bottom: 15px;
        }
        .bottom-menu {
            position: fixed;
            bottom: 0;
            width: 100%;
            background-color: #fff;
            padding: 10px;
            display: flex;
            justify-content: space-around;
            box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1);
        }
        .bottom-menu a {
            text-decoration: none;
            color: #6c5ce7;
            font-size: 24px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="stats-container">
        <h3 id="user-nickname">[닉네임]님의 고민은</h3>
    </div>
</div>

<div class="bottom-menu">
    <a href="#"><i class="fas fa-home"></i></a>
    <a href="#"><i class="fas fa-edit"></i></a>
    <a href="#"><i class="fas fa-comments"></i></a>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const token = localStorage.getItem('token');

        console.log("🚀 [DEBUG] 저장된 토큰:", token); // ✅ 콘솔에서 토큰 확인

        if (!token) {
            alert('로그인이 필요합니다.');
            window.location.href = "/member/login";
            return;
        }

        // ✅ 사용자 정보 가져오기
        fetch('/api/user-info', {
            method: 'GET',
            headers: { 'Authorization': 'Bearer ' + token }
        })
            .then(response => response.json())
            .then(user => {
                console.log("🚀 [DEBUG] 사용자 정보:", user);
                document.getElementById('user-nickname').innerText = `${user.nickname}님의 고민은`;
            })
            .catch(error => console.error("사용자 정보 불러오기 오류:", error));
    });
</script>

</body>
</html>
